<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B04 Import Questions — Summary</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f7f7] font-sans text-sm text-[#1d2327]">
  <div id="wp-chrome"></div>
  <div id="screen-content" class="hidden max-w-xl">

    <!-- Visual Progress Stepper -->
    <div class="grid grid-cols-4 bg-white border border-slate-200 rounded-lg shadow-sm mb-6 overflow-hidden select-none">
      <div class="flex items-center justify-center gap-2 py-3.5 text-[13px] font-semibold text-green-700 bg-white relative">
        <span class="w-5 h-5 rounded-full bg-green-100 text-green-700 flex items-center justify-center font-bold text-[10px]">✓</span>
        <span>Configure</span>
        <div class="absolute -right-2.5 top-1/2 -translate-y-1/2 rotate-45 w-5 h-5 border-t border-r border-slate-200 bg-white z-10"></div>
      </div>
      <div class="flex items-center justify-center gap-2 py-3.5 text-[13px] font-semibold text-green-700 bg-white relative">
        <span class="w-5 h-5 rounded-full bg-green-100 text-green-700 flex items-center justify-center font-bold text-[10px]">✓</span>
        <span>Preview</span>
        <div class="absolute -right-2.5 top-1/2 -translate-y-1/2 rotate-45 w-5 h-5 border-t border-r border-slate-200 bg-white z-10"></div>
      </div>
      <div class="flex items-center justify-center gap-2 py-3.5 text-[13px] font-semibold text-green-700 bg-white relative">
        <span class="w-5 h-5 rounded-full bg-green-100 text-green-700 flex items-center justify-center font-bold text-[10px]">✓</span>
        <span>Importing</span>
        <div class="absolute -right-2.5 top-1/2 -translate-y-1/2 rotate-45 w-5 h-5 border-t border-r border-slate-200 bg-white z-10"></div>
      </div>
      <div class="flex items-center justify-center gap-2 py-3.5 text-[13px] font-semibold text-[#0a6c37] bg-green-50/50">
        <span class="w-5 h-5 rounded-full bg-green-600 text-white flex items-center justify-center font-bold text-[10px]">4</span>
        <span>Completed</span>
      </div>
    </div>

    <!-- Success Notice -->
    <div class="flex gap-3 border-l-4 border-green-600 bg-green-50/55 p-4 text-xs text-green-800 rounded-r mb-5 shadow-sm">
      <svg class="h-5 w-5 text-green-600 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <div>
        <h3 class="font-semibold text-sm mb-0.5 text-green-900">Questions import finished!</h3>
        <p class="leading-relaxed">Questions have been imported into the selected destination bank or quiz.</p>
      </div>
    </div>

    <!-- Operational Receipt Card -->
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm p-6 mb-6">
      <h2 class="text-sm font-semibold border-b pb-2 mb-4 text-slate-800">Import receipt details</h2>
      <div class="grid grid-cols-2 gap-4 text-xs">
        <div class="border rounded p-3 bg-slate-50/40">
          <span class="block text-slate-400 font-medium">Created questions</span>
          <strong class="mt-1 block text-lg text-slate-800" data-bind="rCreated">48</strong>
        </div>
        <div class="border rounded p-3 bg-slate-50/40">
          <span class="block text-slate-400 font-medium">Updated questions</span>
          <strong class="mt-1 block text-lg text-slate-800" data-bind="rUpdated">2</strong>
        </div>
        <div class="border rounded p-3 bg-slate-50/40">
          <span class="block text-slate-400 font-medium">Skipped questions</span>
          <strong class="mt-1 block text-lg text-slate-800" data-bind="rSkipped">5</strong>
        </div>
        <div class="border rounded p-3 bg-slate-50/40">
          <span class="block text-slate-400 font-medium">Failed rows</span>
          <strong class="mt-1 block text-lg text-red-650" data-bind="rFailed">0</strong>
        </div>
      </div>
    </div>

    <!-- Summary Actions -->
    <div class="flex flex-wrap items-center gap-3">
      <a class="inline-flex min-h-9 items-center justify-center rounded bg-[#2271b1] hover:bg-[#135e96] px-5 text-xs font-semibold text-white transition shadow-sm no-underline" id="lp-ie-edit-quiz" href="#">Open destination</a>
      <button type="button" class="inline-flex min-h-9 items-center justify-center rounded border border-slate-300 bg-white px-4 text-xs font-semibold text-slate-700 hover:bg-slate-50 shadow-sm transition" id="lp-ie-import-another">Import another file</button>
    </div>

  </div>
  <script src="assets/flow-data.js"></script>
  <script src="assets/chrome.js"></script>
  <script src="assets/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      LPChrome.mount({ activeScreen: "b04", ieTab: "import_questions", roleLabel: "Import Complete" });
      LPApp.hydrate();
      
      // Override default event to clear local storage and route back to config
      document.getElementById("lp-ie-import-another")?.addEventListener("click", (e) => {
        e.preventDefault();
        sessionStorage.removeItem("lp_ie_wf");
        location.href = "b01-questions-configure.html";
      });
    });
  </script>
</body>
</html>
